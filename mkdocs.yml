site_name: MatterGraph
site_description: Open-source SDK and workbench for physics-aware materials workflows.
site_url: https://cyrusmo.github.io/MatterGraph/
repo_url: https://github.com/cyrusmo/MatterGraph
repo_name: cyrusmo/MatterGraph
edit_uri: edit/main/docs/
copyright: Apache-2.0 licensed

theme:
  name: material
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.action.edit
    - search.suggest
  # Dark is the default and matches the demo workbench; the toggle offers light.
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Architecture: architecture.md
  - Data model: data-model.md
  - Connectors: connectors.md
  - LeMaterial integration: integrations/lematerial.md
  - Scoring: scoring.md
  - Simulation workflows: simulation-workflows.md
  - Examples: examples.md
  - Project:
      - Roadmap: roadmap.md
      - Changelog: changelog.md
      - Contributing: contributing.md

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: [.]
      check_paths: true

plugins:
  - search

# Fail the build on broken internal links rather than shipping them.
strict: true
