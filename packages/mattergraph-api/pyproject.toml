[project]
name = "mattergraph-api"
version = "0.1.0"
description = "FastAPI service for the MatterGraph demo and integrations."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "MatterGraph contributors" }]
keywords = ["materials-science", "fastapi", "api", "materials-informatics"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: FastAPI",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "mattergraph-core",
  "mattergraph-connectors",
  "mattergraph-sim",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29.0",
  "pydantic>=2.5",
  "pydantic-settings>=2.2",
  "pymatgen>=2024.1.1",
]

[project.urls]
Homepage = "https://github.com/cyrusmo/MatterGraph"
Repository = "https://github.com/cyrusmo/MatterGraph"
Issues = "https://github.com/cyrusmo/MatterGraph/issues"
Changelog = "https://github.com/cyrusmo/MatterGraph/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
mattergraph-core = { workspace = true }
mattergraph-connectors = { workspace = true }
mattergraph-sim = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["mattergraph_api"]
