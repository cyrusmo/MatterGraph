[project]
name = "mattergraph-connectors"
version = "0.1.0"
description = "Connectors to public materials databases for MatterGraph."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "MatterGraph contributors" }]
keywords = ["materials-science", "materials-project", "jarvis", "nomad", "lematerial"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "mattergraph-core",
  "httpx>=0.27.0",
  "pandas>=2.0",
  "pymatgen>=2024.1.1",
  "pydantic>=2.5",
  "tqdm>=4.66",
  "mp-api>=0.40.0",
  "jarvis-tools>=2024.1.1",
  "aioitertools",
]

[project.urls]
Homepage = "https://github.com/cyrusmo/MatterGraph"
Repository = "https://github.com/cyrusmo/MatterGraph"
Issues = "https://github.com/cyrusmo/MatterGraph/issues"
Changelog = "https://github.com/cyrusmo/MatterGraph/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
mattergraph-core = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["mattergraph_connectors"]
