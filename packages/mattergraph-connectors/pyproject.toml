[project]
name = "mattergraph-connectors"
version = "0.1.1"
description = "Connectors to public materials databases for MatterGraph."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "MatterGraph contributors" }]
keywords = ["materials-science", "materials-project", "jarvis", "nomad", "lematerial"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "mattergraph-core~=0.1.1",
  "httpx>=0.27.0",
  "pandas>=2.0",
  "pymatgen>=2024.1.1",
  "pydantic>=2.5",
]

# mp-api and jarvis-tools are per-source SDKs, not needed to import this package or to use
# the NOMAD, OPTIMADE, or CSV paths. They are extras so the ImportError hints in
# __init__.py are true statements rather than instructions for an install that already
# happened. `all` exists for explicit full environments such as `uv sync --extra all`.
[project.optional-dependencies]
mp = ["mp-api>=0.40.0"]
jarvis = ["jarvis-tools>=2024.1.1"]
all = ["mp-api>=0.40.0", "jarvis-tools>=2024.1.1"]

[project.urls]
Homepage = "https://github.com/cyrusmo/MatterGraph"
Repository = "https://github.com/cyrusmo/MatterGraph"
Issues = "https://github.com/cyrusmo/MatterGraph/issues"
Changelog = "https://github.com/cyrusmo/MatterGraph/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
mattergraph-core = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["mattergraph_connectors"]
core-metadata-version = "2.4"

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.4"
