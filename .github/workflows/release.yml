name: Release

# Publishes the MatterGraph workspace to PyPI when a `v*` tag is pushed.
#
# Authentication uses PyPI Trusted Publishing (OIDC) — there is no API token to
# store or rotate. Before the first release, register this workflow as a trusted
# publisher for each of the six project names on PyPI and TestPyPI:
#   mattergraph, mattergraph-core, mattergraph-connectors,
#   mattergraph-benchmarks, mattergraph-sim, mattergraph-api
# using owner `cyrusmo`, repository `MatterGraph`, workflow `release.yml`, and
# a package-scoped `pypi*` or `testpypi*` environment. PyPI permits only one
# unconsumed pending project per OIDC identity and at most three pending
# publishers per account, so each first-publication job needs a distinct
# environment claim and the initial deployments are approved in waves.
#
# Run the workflow manually (workflow_dispatch) to publish to TestPyPI instead,
# which is the safe way to rehearse a release.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  # Never publish something that does not pass its own test suite.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v4
        with:
          version: "0.11.7"
      - run: uv sync --all-packages --group dev --extra all
      - run: uv run ruff check .
      - run: uv run pytest

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v4
        with:
          version: "0.11.7"

      - name: Check target registry and immutable version
        env:
          RELEASE_INDEX: ${{ github.event_name == 'workflow_dispatch' && 'testpypi' || 'pypi' }}
        run: python scripts/release_checks.py registry --index "$RELEASE_INDEX" --version 0.1.0

      # Guard against tagging v1.2.3 while pyproject still says 0.1.0.
      - name: Check tag matches project version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          project_version="$(uv version --short)"
          if [ "$tag_version" != "$project_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match project version $project_version"
            exit 1
          fi
          echo "Tag and project version agree: $project_version"

      - name: Build all workspace packages
        run: >-
          uv build --all-packages --out-dir dist --clear --no-create-gitignore
          --build-constraints build-constraints.txt

      - name: Audit release artifacts
        run: python scripts/release_checks.py artifacts --dist dist --version 0.1.0

      - name: Check package metadata
        run: uvx --from twine==6.2.0 twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: dist/
          if-no-files-found: error

  install-artifacts:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
        install-mode: [default, all]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist/
      - name: Install and exercise built distributions
        run: |
          python -m venv .release-smoke
          .release-smoke/bin/python -m pip install --upgrade pip
          .release-smoke/bin/python -m pip install \
            --no-cache-dir \
            --report local-install-report.json \
            dist/*.whl
          if [ "${{ matrix.install-mode }}" = "all" ]; then
            .release-smoke/bin/python -m pip install \
              --no-cache-dir \
              --find-links dist \
              "mattergraph[all]==0.1.0"
          fi
          .release-smoke/bin/python -m pip check
          .release-smoke/bin/python scripts/release_checks.py smoke \
            --version 0.1.0 \
            --mode "${{ matrix.install-mode }}"

  publish-members:
    needs: [build, install-artifacts]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - mattergraph-api
          - mattergraph-benchmarks
          - mattergraph-connectors
          - mattergraph-core
          - mattergraph-sim
    environment: ${{ format('{0}-{1}', github.event_name == 'workflow_dispatch' && 'testpypi' || 'pypi', matrix.package) }}
    permissions:
      contents: read
      id-token: write # required for Trusted Publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist/
      - name: Isolate ${{ matrix.package }} artifacts
        run: >-
          python scripts/release_checks.py select --dist dist
          --package "${{ matrix.package }}" --output publish-dist
      - name: Publish ${{ matrix.package }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: publish-dist/
          repository-url: ${{ github.event_name == 'workflow_dispatch' && 'https://test.pypi.org/legacy/' || '' }}

  publish-metapackage:
    needs: publish-members
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && 'testpypi' || 'pypi' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist/
      - name: Isolate metapackage artifacts
        run: >-
          python scripts/release_checks.py select --dist dist
          --package mattergraph --output publish-dist
      - name: Publish metapackage
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: publish-dist/
          repository-url: ${{ github.event_name == 'workflow_dispatch' && 'https://test.pypi.org/legacy/' || '' }}

  published-install:
    needs: publish-metapackage
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
        install-mode: [default, all]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install from the target registry
        env:
          RELEASE_INDEX: ${{ github.event_name == 'workflow_dispatch' && 'testpypi' || 'pypi' }}
        run: |
          python -m venv .published-smoke
          .published-smoke/bin/python -m pip install --upgrade pip
          spec="mattergraph==0.1.0"
          if [ "${{ matrix.install-mode }}" = "all" ]; then
            spec="mattergraph[all]==0.1.0"
          fi
          if [ "$RELEASE_INDEX" = "testpypi" ]; then
            index_args=(
              --index-url https://test.pypi.org/simple/
              --extra-index-url https://pypi.org/simple/
            )
          else
            index_args=(--index-url https://pypi.org/simple/)
          fi
          .published-smoke/bin/python -m pip install \
            --no-cache-dir \
            --retries 10 \
            --timeout 15 \
            "${index_args[@]}" \
            --report install-report.json \
            "$spec"
          .published-smoke/bin/python -m pip check
          .published-smoke/bin/python scripts/release_checks.py report \
            --report install-report.json \
            --index "$RELEASE_INDEX" \
            --version 0.1.0
          .published-smoke/bin/python scripts/release_checks.py smoke \
            --version 0.1.0 \
            --mode "${{ matrix.install-mode }}"

  github-release:
    needs: [build, published-install]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist/
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
